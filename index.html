<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131c"><title>Dohyun AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131c;color:#edf1fa;font-family:system-ui,sans-serif;height:100dvh;display:flex;justify-content:center}.app{width:100%;max-width:850px;height:100dvh;display:flex;flex-direction:column}header{padding:13px 15px;background:#171c28;border-bottom:1px solid #30394c;display:flex;align-items:center;gap:11px}.logo{background:linear-gradient(135deg,#8b7cff,#4b9cff);border-radius:12px;padding:10px;font-size:20px}.brand{flex:1}.brand b{font-size:16px}.brand small{display:block;color:#9ba7bd;font-size:11px}button{border:0;border-radius:11px;padding:10px 13px;background:#252d40;color:#fff;font-weight:650}button.primary{background:#8b7cff}button:disabled{opacity:.45}main{flex:1;overflow:auto;padding:16px 13px}.welcome{text-align:center;margin:13vh auto 25px}.welcome .star{font-size:42px;color:#8b7cff}.welcome h1{font-size:23px}.welcome p{color:#9ba7bd;line-height:1.6;font-size:13px}.msg{max-width:780px;margin:0 auto 15px;display:flex;flex-direction:column;align-items:flex-start}.msg.user{align-items:flex-end}.who{font-size:11px;color:#9ba7bd;margin:0 7px 5px}.bubble{max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:12px 14px;border-radius:16px;background:#1b2433;font-size:14px}.user .bubble{background:#39345f}.composer{background:#171c28;border-top:1px solid #30394c;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}.status{font-size:11px;color:#9ba7bd;min-height:22px}.entry{display:flex;gap:7px;background:#202738;border-radius:15px;padding:7px}textarea{flex:1;min-width:0;resize:none;max-height:120px;border:0;outline:0;background:transparent;color:white;font:inherit;padding:8px;line-height:1.5}.send{background:#8b7cff;font-size:18px}.tools{display:flex;gap:7px;margin-top:8px;align-items:center}.tools button{font-size:11px;padding:8px}.hint{font-size:10px;color:#9ba7bd;margin-left:auto}.modal{display:none;position:fixed;inset:0;background:#000a;align-items:flex-end;padding:12px}.modal.open{display:flex}.sheet{width:100%;max-width:600px;margin:auto;background:#171c28;border-radius:18px;padding:18px}.sheet label{display:block;color:#9ba7bd;font-size:12px;margin:12px 0 6px}.sheet textarea{width:100%;min-height:110px;background:#202738;border-radius:10px}.sheet select{width:100%;padding:10px;background:#202738;color:white;border:1px solid #30394c;border-radius:9px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.note{font-size:11px;color:#9ba7bd;line-height:1.5;background:#202738;padding:10px;border-radius:10px;margin-top:12px}
</style></head><body><div class="app">
<header><div class="logo">✦</div><div class="brand"><b>Dohyun AI</b><small>브라우저 로컬 AI · API 키 없음</small></div><button id="new">＋</button><button id="settings">⚙</button></header>
<main id="chat"><div class="welcome" id="welcome"><div class="star">✦</div><h1>무엇이든 물어보세요</h1><p>첫 실행 시 AI 모델을 다운로드합니다.<br>모델 준비 후 브라우저 안에서 답변을 생성해요.</p><button class="primary" id="load">AI 모델 준비하기</button></div></main>
<div class="composer"><div class="status" id="status">먼저 AI 모델을 준비해 주세요.</div><div class="entry"><textarea id="prompt" rows="1" placeholder="Dohyun AI에게 물어보세요…" disabled></textarea><button class="send" id="send" disabled>➤</button></div><div class="tools"><button id="clear">대화 비우기</button><button id="export">내보내기</button><span class="hint">Enter 전송 · Shift+Enter 줄바꿈</span></div></div></div>
<div class="modal" id="modal"><div class="sheet"><h3>AI 설정</h3><label>AI 성격과 지침</label><textarea id="system"></textarea><label>답변 길이</label><select id="length"><option value="128">짧게</option><option value="220" selected>보통</option><option value="320">길게</option></select><div class="note">소형 모델이라 대형 AI보다 답변 품질이 낮을 수 있습니다. 모델 실행은 기기 메모리와 GPU 지원에 영향을 받습니다.</div><div class="actions"><button id="cancel">닫기</button><button class="primary" id="save">저장</button></div></div></div>
<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';
const MODEL='onnx-community/Qwen2.5-0.5B-Instruct';
const $=id=>document.getElementById(id);
env.allowLocalModels=false;env.allowRemoteModels=true;env.useBrowserCache=true;
let model=null,loading=false,busy=false,history=[];
let system=localStorage.getItem('dohyun-system')||'너는 Dohyun AI라는 친절하고 정확한 한국어 AI 도우미야. 핵심부터 자연스러운 한국어로 답하고, 모르는 내용은 모른다고 말해.';
$('system').value=system;$('length').value=localStorage.getItem('dohyun-length')||'220';
function status(t){$('status').textContent=t}
function draw(role,text){$('welcome')?.remove();let w=document.createElement('div');w.className='msg '+role;let n=document.createElement('div');n.className='who';n.textContent=role==='user'?'나':'Dohyun AI';let b=document.createElement('div');b.className='bubble';b.textContent=text;w.append(n,b);$('chat').append(w);$('chat').scrollTop=$('chat').scrollHeight;return b}
function persist(){localStorage.setItem('dohyun-history',JSON.stringify(history))}
async function loadModel(){if(model||loading)return;loading=true;$('load').disabled=true;status('브라우저 지원 확인 및 모델 준비 중…');
try{let device=navigator.gpu?'webgpu':'wasm';try{model=await pipeline('text-generation',MODEL,{device,dtype:'q4',progress_callback:p=>{if(p.status==='progress')status('모델 다운로드 중… '+Math.round(p.progress||0)+'%')}})}catch(e){if(device!=='webgpu')throw e;status('GPU 실행이 안 되어 CPU 방식으로 재시도합니다…');model=await pipeline('text-generation',MODEL,{device:'wasm',dtype:'q4',progress_callback:p=>{if(p.status==='progress')status('모델 다운로드 중… '+Math.round(p.progress||0)+'%')}})}
$('prompt').disabled=false;$('send').disabled=false;$('load').textContent='모델 준비 완료';status('준비 완료! 질문을 입력해 주세요.');}catch(e){console.error(e);status('모델을 불러오지 못했습니다. Chrome 최신 버전, 인터넷 연결, 저장 공간을 확인해 주세요.');draw('assistant','모델 로딩 오류: '+(e.message||e)+'\\n기기 메모리가 부족하거나 WebGPU/WASM이 지원되지 않을 수 있습니다.');$('load').disabled=false;$('load').textContent='다시 시도'}finally{loading=false}}
async function send(){let q=$('prompt').value.trim();if(!q||busy)return;if(!model){await loadModel();if(!model)return} $('prompt').value='';history.push({role:'user',content:q});draw('user',q);persist();busy=true;$('send').disabled=true;$('prompt').disabled=true;status('답변 생성 중…');let bubble=draw('assistant','생각 중…');
try{let input=[{role:'system',content:system},...history.slice(-10)];let result=await model(input,{max_new_tokens:Number($('length').value),do_sample:true,temperature:.7,top_p:.9,repetition_penalty:1.1});let answer=result?.[0]?.generated_text;if(Array.isArray(answer)){answer=answer.filter(x=>x.role==='assistant').at(-1)?.content||''}if(typeof answer!=='string')answer=String(answer||'답변을 만들지 못했어요.');if(answer.includes('assistant\n'))answer=answer.split('assistant\n').at(-1);answer=answer.trim()||'답변을 만들지 못했어요.';bubble.textContent=answer;history.push({role:'assistant',content:answer});persist();status('답변 완료')}catch(e){bubble.textContent='오류: '+(e.message||e);status('답변 생성 오류')}finally{busy=false;$('send').disabled=false;$('prompt').disabled=false}}
$('load').onclick=loadModel;$('send').onclick=send;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('prompt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});
$('new').onclick=()=>{if(busy)return;history=[];persist();$('chat').innerHTML='<div class="welcome" id="welcome"><div class="star">✦</div><h1>새로운 대화</h1><p>무엇이든 물어보세요.</p></div>'};
$('clear').onclick=()=>{if(confirm('대화 기록을 지울까요?'))$('new').click()};
$('settings').onclick=()=>$('modal').classList.add('open');$('cancel').onclick=()=>$('modal').classList.remove('open');$('save').onclick=()=>{system=$('system').value.trim()||system;localStorage.setItem('dohyun-system',system);localStorage.setItem('dohyun-length',$('length').value);$('modal').classList.remove('open');status('설정 저장 완료')};
$('export').onclick=()=>{let a=document.createElement('a');let u=URL.createObjectURL(new Blob([JSON.stringify(history,null,2)],{type:'application/json'}));a.href=u;a.download='dohyun-ai-chat.json';a.click();URL.revokeObjectURL(u)};
try{history=JSON.parse(localStorage.getItem('dohyun-history')||'[]');history.forEach(m=>draw(m.role,m.content));if(history.length)status('이전 대화를 불러왔습니다. 모델을 준비하면 이어서 대화할 수 있어요.')}catch{}
</script></body></html>
